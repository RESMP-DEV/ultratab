# XcodeGen spec for the Ultra Tab iPhone app. Generate with `xcodegen` here.
name: UltraTab
options:
  bundleIdPrefix: dev.lapis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/UltraTab.xcconfig
  Release: Config/UltraTab.xcconfig
targets:
  # The deck of agents that need you (README.md).
  UltraTab:
    type: application
    platform: iOS
    sources: [UltraTab]
    info:
      path: UltraTab/Info.plist
      properties:
        CFBundleDisplayName: Ultra Tab
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LapisDefaultHost: $(LAPIS_DEFAULT_HOST)
        NSLocalNetworkUsageDescription: Ultra Tab connects to the lapis gateway on your Mac over Tailscale or ZeroTier.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lapis.ultratab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  UltraTabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UltraTabUITests]
    dependencies:
      - target: UltraTab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lapis.ultratab.uitests
        TEST_TARGET_NAME: UltraTab
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  # The app's logic compiled with its tests, as scripts/check_ultratab_ios.py
  # builds them.
  UltraTabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UltraTabTests
      - UltraTab/Cards.swift
      - UltraTab/Deck.swift
      - UltraTab/DeckGateway.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lapis.ultratab.unittests
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UltraTab:
    build:
      targets:
        UltraTab: all
        UltraTabUITests: [test]
        UltraTabTests: [test]
    test:
      targets: [UltraTabUITests, UltraTabTests]
